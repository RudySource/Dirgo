[package]
name = "dirgo"
version = "0.4.0"
default-run = "dgo"
edition = "2024"
rust-version = "1.89"
description = "Instant directory navigation for your terminal"
readme = "README.md"
repository = "https://github.com/RudySource/Dirgo"
homepage = "https://github.com/RudySource/Dirgo"
license = "MIT OR Apache-2.0"
keywords = ["cli", "terminal", "filesystem", "fuzzy-search", "navigation"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["command_for_dev.md", "for_social/**"]

[features]
default = []
benchmark-tools = []

[[bin]]
name = "dgo"
path = "src/main.rs"

[[bin]]
name = "dgo-fixture"
path = "src/bin/dgo-fixture.rs"
required-features = ["benchmark-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
fs2 = "0.4.3"
ignore = "0.4.33"
libc = "0.2.183"
nucleo = "0.5.0"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
redb = "4.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-escape = "0.1.5"
thiserror = "2.0.20"
tempfile = "3.27.0"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = { version = "0.5.1", default-features = false }
predicates = "3.1.4"

[[bench]]
name = "index_pipeline"
harness = false

[[bench]]
name = "suggestions"
harness = false
