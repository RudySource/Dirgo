name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.89"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Linux PTY test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y expect zsh fish

      - name: Verify repository hygiene
        shell: bash
        run: scripts/repository-hygiene.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo build --release --bin dgo
      - name: Build PowerShell predictor
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet restore powershell/DirgoPredictor/DirgoPredictor.csproj --locked-mode
          dotnet build powershell/DirgoPredictor/DirgoPredictor.csproj --configuration Release --no-restore
          dotnet list powershell/DirgoPredictor/DirgoPredictor.csproj package --vulnerable --include-transitive
          $version = (& target/release/dgo.exe --version) -replace '^dgo\s+', ''
          New-Item -ItemType Directory -Force "target/release/DirgoPredictor/$version" | Out-Null
          Copy-Item powershell/DirgoPredictor/bin/Release/net8.0/DirgoPredictor.dll, powershell/DirgoPredictor/DirgoPredictor.psd1 "target/release/DirgoPredictor/$version/"
      - name: Unix installer smoke
        if: runner.os != 'Windows'
        env:
          DGO_BIN: ${{ github.workspace }}/target/release/dgo
        run: scripts/installer-smoke.sh
      - name: PowerShell installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $assets = Join-Path $env:RUNNER_TEMP 'dirgo-installer-assets'
          $stage = Join-Path $env:RUNNER_TEMP 'dirgo-installer-stage'
          $destination = Join-Path $env:RUNNER_TEMP 'dirgo-installer-destination'
          New-Item -ItemType Directory -Force $assets, "$stage/dirgo-smoke" | Out-Null
          Copy-Item target/release/dgo.exe "$stage/dirgo-smoke/dgo.exe"
          Copy-Item target/release/DirgoPredictor "$stage/dirgo-smoke/DirgoPredictor" -Recurse
          Compress-Archive -Path "$stage/dirgo-smoke" -DestinationPath "$assets/dirgo-x86_64-pc-windows-msvc.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$assets/dirgo-x86_64-pc-windows-msvc.zip").Hash.ToLowerInvariant()
          "$hash  dirgo-x86_64-pc-windows-msvc.zip" | Set-Content -Encoding ascii "$assets/SHA256SUMS"
          $env:DIRGO_DOWNLOAD_BASE = ([uri]$assets).AbsoluteUri.TrimEnd('/')
          $env:DIRGO_INSTALL_DIR = $destination
          $env:DIRGO_SETUP = 'skip'
          & ./install/dirgo-installer.ps1
          & "$destination/dgo.exe" --version
          if (-not (Get-ChildItem "$destination/DirgoPredictor/*/DirgoPredictor.dll" -File)) { throw 'predictor was not installed' }
          if (-not (Get-ChildItem "$destination/DirgoPredictor/*/DirgoPredictor.psd1" -File)) { throw 'predictor manifest was not installed' }
      - name: PowerShell navigation and suggestions smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-suggestions-smoke.ps1 -DgoBin (Resolve-Path target/release/dgo.exe)
      - name: Verify Linux glibc compatibility baseline
        if: runner.os == 'Linux'
        run: |
          maximum=$(objdump -T target/release/dgo | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n 1)
          printf 'Maximum required glibc symbol: %s\n' "$maximum"
          test "$(printf '%s\n' GLIBC_2.35 "$maximum" | sort -V | tail -n 1)" = GLIBC_2.35
      - if: runner.os != 'Windows'
        run: cargo build --release --bin dgo-fixture --features benchmark-tools
      - if: runner.os != 'Windows'
        run: cargo bench --bench index_pipeline --no-run
      - if: runner.os != 'Windows'
        run: cargo bench --bench suggestions --no-run
      - name: External benchmark smoke
        if: runner.os != 'Windows'
        env:
          DGO_BIN: ${{ github.workspace }}/target/release/dgo
          DGO_FIXTURE_BIN: ${{ github.workspace }}/target/release/dgo-fixture
        run: scripts/benchmark-cli.sh --directories 100 --samples 1
      - name: Linux PTY terminal and shell gates
        if: runner.os == 'Linux'
        env:
          DGO_BIN: ${{ github.workspace }}/target/release/dgo
        run: |
          export DGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          expect scripts/pty-picker-smoke.exp
          expect scripts/pty-terminal-gates.exp
          expect scripts/pty-shell-matrix.exp
          DGO_BASH_MAJOR="${BASH_VERSINFO[0]}" expect scripts/pty-suggestions-smoke.exp
          expect scripts/pty-zsh-live-completion.exp
          expect scripts/pty-update-status.exp

  dependency-policy:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # main
        with:
          tool: cargo-deny
          fallback: none
      - run: cargo deny check
